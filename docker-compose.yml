services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: fieldops
    # host ports are overridable: PG_PORT=5432 docker compose up
    ports: ["${PG_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/fieldops
      DB_USER: fieldops
      DB_PASSWORD: fieldops
      REDIS_HOST: redis
      JWT_SECRET: change-this-to-a-long-random-secret-at-least-32-bytes
    ports: ["${APP_PORT:-8081}:8080"]

volumes:
  pgdata:
