server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: fieldops
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fieldops}
    username: ${DB_USER:fieldops}
    password: ${DB_PASSWORD:fieldops}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: 480
  workorder:
    max-active-per-technician: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info